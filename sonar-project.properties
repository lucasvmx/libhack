sonar.projectKey=lucasvmx_libhack
sonar.organization=lucasvmx

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=libhack
sonar.projectVersion=0.3

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# The test executable is kept under the same source root as the library.
# Keep it in test scope so it does not count as production code in the quality gate.
sonar.tests=src
sonar.test.inclusions=src/unit_test.c
sonar.exclusions=src/unit_test.c

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
