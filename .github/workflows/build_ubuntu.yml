name: Build (Ubuntu)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ubuntu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.systems }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.systems }}
    timeout-minutes: 15
    strategy:
        fail-fast: false
        matrix:
          include:
            - systems: ubuntu-22.04
              architecture: x64
              cflags: ""
            - systems: ubuntu-24.04
              architecture: x64
              cflags: ""
            - systems: ubuntu-22.04
              architecture: x86
              cflags: "-m32"
            - systems: ubuntu-24.04
              architecture: x86
              cflags: "-m32"

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autorevision gcc-multilib g++-multilib

    - name: Generate revision information
      run: autorevision -t h > autorevision.h

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBHACK_BUILD_EXAMPLES=ON -DCMAKE_C_FLAGS="${{ matrix.cflags }}"

    - name: Build library and examples
      run: cmake --build build --parallel

    - name: Run tests
      run: cmake --build build --target test
