name: ubuntults

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.systems }}
    strategy:
        matrix:
          systems: [ubuntu-20.04,ubuntu-22.04]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autorevision libprocps-dev

    - name: Generate revision information
      run: autorevision -t h > autorevision.h

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBHACK_BUILD_EXAMPLES=ON

    - name: Build library and examples
      run: cmake --build build --parallel

    - name: Run tests
      run: cmake --build build --target test
