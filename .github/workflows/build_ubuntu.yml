name: Build (Ubuntu)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ubuntu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.systems }}
    runs-on: ${{ matrix.systems }}
    timeout-minutes: 15
    strategy:
        fail-fast: false
        matrix:
          systems: [ubuntu-22.04,ubuntu-24.04]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autorevision

    - name: Generate revision information
      run: autorevision -t h > autorevision.h

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBHACK_BUILD_EXAMPLES=ON

    - name: Build library and examples
      run: cmake --build build --parallel

    - name: Run tests
      run: cmake --build build --target test
