name: Build (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.systems }}
    runs-on: ${{ matrix.systems }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        systems: [windows-2022,windows-2025]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate revision information
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/Autorevision/autorevision/master/autorevision.sh -o autorevision
        chmod +x autorevision
        ./autorevision -t h > autorevision.h

    - name: Configure CMake
      run: cmake -G "MinGW Makefiles" -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBHACK_BUILD_EXAMPLES=ON

    - name: Build library and examples
      run: cmake --build build --parallel

    - name: Run tests
      run: cmake --build build --target test
