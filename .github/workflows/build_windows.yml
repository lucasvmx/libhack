name: Build (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.systems }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.systems }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - systems: windows-2022
            architecture: x64
            cmake_architecture: x64
          - systems: windows-2022
            architecture: x86
            cmake_architecture: Win32

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate revision information
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/Autorevision/autorevision/master/autorevision.sh -o autorevision
        chmod +x autorevision
        ./autorevision -t h > autorevision.h

    - name: Configure CMake
      run: cmake -G "Visual Studio 17 2022" -A ${{ matrix.cmake_architecture }} -S . -B build -DLIBHACK_BUILD_EXAMPLES=ON

    - name: Build library and examples
      run: cmake --build build --config Release --parallel

    - name: Run tests
      run: cmake --build build --config Release --target test
